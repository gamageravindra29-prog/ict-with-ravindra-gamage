
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102d59">
  <link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon.png">
  <link rel="icon" type="image/png" href="./icon.png">
  <title>ICT WITH RAVINDRA GAMAGE</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }
    header {
      background: linear-gradient(135deg,#102d59,#1765ae);
      color: white;
      padding: 45px 20px;
      text-align: center;
      border-radius: 0 0 25px 25px;
    }
    header h1 { font-size: 25px; }
    .container {
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 22px;
      border-radius: 16px;
      margin-top: 20px;
      box-shadow: 0 3px 12px #00000010;
    }
    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 9px;
      font-size: 16px;
    }
    input { border: 1px solid #cbd5e1; }
    button {
      border: 0;
      background: #1765ae;
      color: white;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <h1>ICT WITH RAVINDRA GAMAGE</h1>
    <p>STUDENT APP</p>
    <p>LEARN • PRACTICE • ACHIEVE</p>
  </header>


<main class="container">

  <div class="card" id="loginSection">
    <h2>Welcome Student!</h2>
    <p>ඔබගේ ICT ඉගෙනුම් අවකාශයට සාදරයෙන් පිළිගනිමු.</p>

    <input type="text" id="studentId" placeholder="Enter Student ID">

    <button onclick="studentLogin()">STUDENT LOGIN</button>

    <p id="message"></p>
  </div>

  <div class="card" id="dashboardSection" style="display:none;">
    <h2>STUDENT DASHBOARD</h2>
    <img id="studentPhoto"
     src=""
     alt="Student Photo"
     style="width:120px;height:120px;object-fit:cover;
     border-radius:50%;display:none;margin:10px auto;">
    <h3 id="studentName"></h3>
    <p>Student ID: <span id="displayStudentId"></span></p>
    <p>Grade: <span id="studentGrade"></span></p>
    <hr>
    <h3>MY LEARNING</h3>
    <p>📚 ICT Lessons</p>
    <p>📝 Activities</p>
    <p>📊 Exam Results</p>
    <p>🏆 Achievements</p>
    
<hr>
<h3>📊 MY EXAM RESULTS</h3>

<button onclick="loadExamResults()">
  VIEW EXAM RESULTS
</button>

<div id="examResults"></div>

  </div>

</main>

  <script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function() {
    navigator.serviceWorker.register("./service-worker.js")
      .then(function() {
        console.log("Offline support enabled!");
      })
      .catch(function(error) {
        console.log("Service Worker Error:", error);
      });
  });
}
</script>
  <script>

async function studentLogin() {
  const studentId = document.getElementById("studentId").value.trim();
  const message = document.getElementById("message");

  if (!studentId) {
    message.textContent = "Please enter your Student ID.";
    return;
  }

  message.textContent = "Checking Student ID...";

  const apiUrl = "https://script.google.com/macros/s/AKfycbzLjJY3h09NEn04MZhVWxrp1YFiSJ5OAAKjR7lzjcPIE8_zelpQZW-u_5xcl9a8cL73cg/exec";

  try {
    const response = await fetch(
      apiUrl + "?action=studentLogin&studentId=" + encodeURIComponent(studentId)
    );

    const result = await response.json();

    if (result.success) {
      document.getElementById("studentName").textContent =
        "WELCOME " + result.student.name;
      const photo = await fetch(
  apiUrl + "?action=studentPhoto&studentId=" +
  encodeURIComponent(studentId)
);

const photoData = await photo.json();

if (photoData.success && photoData.photo) {
  document.getElementById("studentPhoto").src =
    "data:" + photoData.photo.mimeType +
    ";base64," + photoData.photo.base64;

  document.getElementById("studentPhoto").style.display = "block";
}

      document.getElementById("displayStudentId").textContent =
        result.student.studentId;

      document.getElementById("studentGrade").textContent =
        result.student.grade;

      document.getElementById("loginSection").style.display = "none";
      document.getElementById("dashboardSection").style.display = "block";

    } else {
      message.textContent = result.message;
    }

  } catch (error) {
    message.textContent = "Connection error. Please try again.";
  }
}


async function loadExamResults() {

  const studentId = document.getElementById("displayStudentId").textContent;
  const resultBox = document.getElementById("examResults");

  resultBox.innerHTML = "Loading exam results...";

  const apiUrl = "https://script.google.com/macros/s/AKfycbzLjJY3h09NEn04MZhVWxrp1YFiSJ5OAAKjR7lzjcPIE8_zelpQZW-u_5xcl9a8cL73cg/exec";

  try {

    const response = await fetch(
      apiUrl + "?action=studentResults&studentId=" + encodeURIComponent(studentId)
    );

    const data = await response.json();

    if (!data.success) {
      resultBox.textContent = data.message || "Results not available.";
      return;
    }

    if (!data.results || data.results.length === 0) {
      resultBox.textContent = "No exam results available.";
      return;
    }

    const results = data.results;

    const totalExams = results.length;

    const average = results.reduce(
      (sum, exam) => sum + Number(exam.marks || 0), 0
    ) / totalExams;

    const best = Math.max(
      ...results.map(exam => Number(exam.marks || 0))
    );

    resultBox.innerHTML = `

      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0;">

        <div style="background:#dbeafe;padding:12px;border-radius:12px;text-align:center;">
          <h2>${totalExams}</h2>
          <small>Total Exams</small>
        </div>

        <div style="background:#dcfce7;padding:12px;border-radius:12px;text-align:center;">
          <h2>${average.toFixed(1)}%</h2>
          <small>Average Marks</small>
        </div>

        <div style="background:#fef3c7;padding:12px;border-radius:12px;text-align:center;">
          <h2>${best}</h2>
          <small>Best Result</small>
        </div>

      </div>

      ${results.map(exam => `
        <div style="background:#f1f5f9;padding:15px;margin:12px 0;border-radius:12px;">
          <h3>${exam.examName}</h3>
          <p>Subject: ${exam.subject}</p>
          <p>Date: ${exam.examDate}</p>
          <h2>${exam.marks} / ${exam.maxMarks}</h2>
          <p>Grade: ${exam.examGrade}</p>
          <p>Rank: ${exam.rank}</p>
        </div>
      `).join("")}

    `;

  } catch (error) {
    resultBox.textContent = "Unable to load results. Please try again.";
  }
}


</script>
</body>
</html>
