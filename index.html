
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102d59">
  <link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon.png">
  <link rel="icon" type="image/png" href="./icon.png">
  <title>ICT WITH RAVINDRA GAMAGE</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }
    header {
      background: linear-gradient(135deg,#102d59,#1765ae);
      color: white;
      padding: 45px 20px;
      text-align: center;
      border-radius: 0 0 25px 25px;
    }
    header h1 { font-size: 25px; }
    .container {
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 22px;
      border-radius: 16px;
      margin-top: 20px;
      box-shadow: 0 3px 12px #00000010;
    }
    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 9px;
      font-size: 16px;
    }
    input { border: 1px solid #cbd5e1; }
    button {
      border: 0;
      background: #1765ae;
      color: white;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <h1>ICT WITH RAVINDRA GAMAGE</h1>
    <p>STUDENT APP</p>
    <p>LEARN • PRACTICE • ACHIEVE</p>
  </header>

  <main class="container">
    <div class="card">
      <h2>Welcome Student!</h2>
      <p>ඔබගේ ICT ඉගෙනුම් අවකාශයට සාදරයෙන් පිළිගනිමු.</p>
     <input type="text" id="studentId" placeholder="Enter Student ID">
<button onclick="studentLogin()">STUDENT LOGIN</button>
<p id="message"></p>
      <p>Lessons • Activities • Online Tests • Results</p>
    </div>
  </main>
  <script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function() {
    navigator.serviceWorker.register("./service-worker.js")
      .then(function() {
        console.log("Offline support enabled!");
      })
      .catch(function(error) {
        console.log("Service Worker Error:", error);
      });
  });
}
</script>
  <script>
async function studentLogin() {
  const studentId = document.getElementById("studentId").value.trim();
  const message = document.getElementById("message");

  if (!studentId) {
    message.textContent = "Please enter your Student ID.";
    return;
  }

  message.textContent = "Checking Student ID...";

  const apiUrl = "https://script.google.com/macros/s/AKfycbzLjJY3h09NEn04MZhVWxrp1YFiSJ5OAAKjR7lzjcPIE8_zelpQZW-u_5xcl9a8cL73cg/exec";

  try {
    const response = await fetch(
      apiUrl + "?action=studentLogin&studentId=" + encodeURIComponent(studentId)
    );

    const result = await response.json();

    if (result.success) {
      message.textContent = "Welcome " + result.student.name + "!";
    } else {
      message.textContent = result.message;
    }

  } catch (error) {
    message.textContent = "Connection error. Please try again.";
  }
}
</script>
</body>
</html>
